# Butterfly 增量配置
# 只写要覆盖主题默认值的项，其余全部用主题自带默认值。
# 主题自带默认值见 node_modules/hexo-theme-butterfly/_config.yml；
# 这样主题升级时不会和本地改动打架（原 Next 主题是直接改主题目录，升级很痛苦）。

# 首页不显示顶部大图与站点标题，第一屏直接进文章列表。
# 导航栏仍在，SEO 用的隐藏 h1 也保留。
index_img: false
# 归档 / 标签 / 分类页也有同样的大图，需要一起去掉就取消注释：
# archive_img: false
# tag_img: false
# category_img: false

favicon: /images/favicon.ico

avatar:
  img: /images/weixin.jpg
  effect: false

menu:
  首页: / || fas fa-home
  标签: /tags/ || fas fa-tags
  归档: /archives/ || fas fa-archive

social:
  fab fa-github: https://github.com/zavier || Github || '#24292e'
  fab fa-zhihu: >-
    https://www.zhihu.com/people/zheng-wei-4-95/answers
    || 知乎 || '#0084ff'

# 侧边栏卡片
aside:
  card_author:
    # 主题默认指向占位地址 https://github.com/xxxxxx，换成自己的主页
    button:
      link: https://github.com/zavier
  # 公告卡片内容还是主题默认的占位文案，先关掉
  card_announcement:
    enable: false

toc:
  post: true
  number: true
  expand: false

busuanzi:
  site_uv: true
  site_pv: true
  page_pv: true

footer:
  owner:
    enable: true
    since: 2019
  # 去掉右下角的「框架 Hexo x.x.x | 主题 Butterfly x.x.x」
  copyright:
    enable: false
  # 备案号：Butterfly 没有 Next 那样的 beian 配置项，走页脚自定义 HTML
  custom_text: >-
    <a href="https://beian.miit.gov.cn/" target="_blank"
    rel="noopener">黑ICP备19000073号-1</a>

# 文章页不要分享按钮（facebook/x/微信 等，留空即关闭）
share:
  use: false

# 不要"版权声明"区块
post_copyright:
  enable: false

# Mermaid：
# hexo-filter-mermaid-diagrams 把 ```mermaid 代码块输出成 <pre class="mermaid">，
# 而 Butterfly 自带的渲染只认 .mermaid-wrap，两边标记对不上会导致图完全不显示，
# 所以关掉主题渲染、由页脚脚本加载 mermaid.js 直接渲染 .mermaid 元素。
mermaid:
  enable: false
inject:
  head:
    - >-
      <style>
      /* 作者卡/手机上侧边栏的「分类」入口，博客没有分类，先隐藏 */
      .site-data > a[href$="/categories/"] {display:none}
      /* 暗色模式下给 mermaid 图套白底：图是亮色主题绘制的，深色连线在近黑
         背景上看不见（我们绕过主题自带渲染，图不跟随日夜切换重绘） */
      html[data-theme="dark"] pre.mermaid {
      background:#fff;border-radius:8px;padding:12px;margin:0 0 1em
      }
      </style>
  bottom:
    - >-
      <script src="https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.min.js">
      </script>
    - '<script>mermaid.initialize({ startOnLoad: true });</script>'
